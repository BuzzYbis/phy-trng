# ---------------------------------------------------------------------------- #
#  Package Configuration                                                     - #
# ---------------------------------------------------------------------------- #
#
# Bounded sequential ring buffer. Creusot owns this package; see
# `proofs/creusot/coverage.md`.
#
# This is a *sequential cooperative* model. Cross-domain ordering and hostile
# mutation belong to `ptrng-xfer`/`ptrng-sync` and are M6 obligations.

[package]
name = "ptrng-spsc"
version = "0.1.0"
edition = "2024"
authors = ["BuzzY_ <contact@buzzybis.com>"]
description = "Bounded sequential ring buffer with a proved FIFO and ownership model"
license = "MIT"
repository = "https://github.com/BuzzYbis/phy-trng"
readme = "README.md"
keywords = ["ringbuffer", "verification", "no-std", "fifo"]
categories = ["data-structures", "no-std"]

[dependencies]
creusot-std = { version = "0.14.0-dev", default-features = false }


[lints]
workspace = true
